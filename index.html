<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoodedhacker32 // Project Directory</title>
    <!-- Fonts: JetBrains Mono for the 'system' feel, Inter for the 'content' feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0a0c;
            --surface-color: #16161a;
            --surface-hover: #1c1c22;
            --accent-color: #5dfcf0; /* Electric Mint */
            --accent-muted: rgba(93, 252, 240, 0.2);
            --text-primary: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #2d2d35;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Background Atmosphere --- */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, #1a1a2e 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* --- Header Section --- */
        header {
            padding: 4rem 2rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
            text-align: left;
        }

        .terminal-header {
            font-family: var(--font-mono);
            display: inline-block;
            position: relative;
        }

        .prompt {
            color: var(--accent-color);
            font-weight: 700;
            margin-right: 0.5rem;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- Main Content --- */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem 5rem;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .repo-grid.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Project Cards (Bento-ish) --- */
        .project-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .project-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            transform: translateX(-100%);
            transition: var(--transition);
            opacity: 0;
        }

        .project-card:hover {
            background: var(--surface-hover);
            border-color: var(--accent-color);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 15px var(--accent-muted);
        }

        .project-card:hover::before {
            transform: translateX(100%);
            opacity: 1;
            transition: transform 0.6s ease;
        }

        .card-title {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 0.75rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title::before {
            content: "/";
            color: var(--accent-color);
            opacity: 0.6;
        }

        .card-description {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin: 0 0 2rem 0;
            min-height: 3rem;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .visit-link {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: var(--transition);
        }

        .visit-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* --- Loading & Error States --- */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            font-family: var(--font-mono);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-box {
            background: rgba(255, 0, 0, 0.05);
            border: 1px solid rgba(255, 0, 0, 0.2);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
            font-family: var(--font-mono);
        }

        .retry-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
            margin-top: 1rem;
            transition: var(--transition);
        }

        .retry-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        @media (max-width: 600px) {
            .header-title { font-size: 1.8rem; }
            header { padding: 2rem 1rem 1rem; }
            main { padding: 0 1rem 3rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="terminal-header">
            <h1 class="header-title"><span class="prompt">$</span> hoodedhacker32</h1>
            <div class="header-subtitle">
                <span class="status-dot"></span>
                <span>root@directory:~/active_projects</span>
            </div>
        </div>
    </header>

    <main>
        <div id="status-area">
            <div class="loading-container">
                <div class="fg-muted" style="color: var(--text-muted); font-family: var(--font-mono);">Scanning for active deployments...</div>
                <div class="spinner"></div>
            </div>
        </div>
        <div id="repo-grid" class="repo-grid" style="display: none;">
            <!-- Dynamic Cards Inserted Here -->
        </div>
    </main>

    <script>
        const USERNAME = 'hoodedhacker32';
        const API_BASE = 'https://api.github.com';
        const SITE_BASE = `https://${USERNAME}.github.io`;

        async function init() {
            const grid = document.getElementById('repo-grid');
            const statusArea = document.getElementById('status-area');

            try {
                const reposResponse = await fetch(`${API_BASE}/users/${USERNAME}/repos?per_page=100`);
                if (!reposResponse.ok) throw new Error('Failed to fetch repositories');
                const repos = await reposResponse.json();

                const filteredRepos = repos.filter(repo => repo.name !== `${USERNAME}.github.io`);

                const validationPromises = filteredRepos.map(async (repo) => {
                    try {
                        const detailResponse = await fetch(`${API_BASE}/repos/${USERNAME}/${repo.name}`);
                        if (!detailResponse.ok) return null;
                        const detail = await detailResponse.json();
                        return detail.has_pages ? repo : null;
                    } catch (e) {
                        return null;
                    }
                });

                const results = await Promise.all(validationPromises);
                const activeSites = results.filter(repo => repo !== null);

                if (activeSites.length === 0) {
                    statusArea.innerHTML = '<div class="text-center py-5" style="color: var(--text-muted); font-family: var(--font-mono);">No active project sites found.</div>';
                    return;
                }

                activeSites.forEach((repo, index) => {
                    const card = document.createElement('a');
                    card.className = 'project-card';
                    card.href = `${SITE_BASE}/${repo.name}/`;
                    card.target = '_blank';
                    card.style.animationDelay = `${index * 0.05}s`; // Staggered reveal

                    card.innerHTML = `
                        <div class="card-content">
                            <h3 class="card-title">${repo.name}</h3>
                            <p class="card-description">${repo.description || 'No description available for this project.'}</p>
                        </div>
                        <div class="card-footer">
                            <span class="visit-link">
                                <span>VIEW_SITE</span>
                                <span>&rarr;</span>
                            </span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                statusArea.style.display = 'none';
                grid.style.display = 'grid';
                setTimeout(() => grid.classList.add('visible'), 50);

            } catch (error) {
                console.error(error);
                statusArea.innerHTML = `
                    <div class="error-box">
                        <div class="text-danger font-bold" style="color: #ff6b6b; font-weight: 700; margin-bottom: 0.5rem;">SYSTEM_ERROR</div>
                        <div class="text-small" style="color: var(--text-muted); margin-bottom: 1rem;">${error.message}</div>
                        <button onclick="location.reload()" class="retry-btn">Re-initialize</button>
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
